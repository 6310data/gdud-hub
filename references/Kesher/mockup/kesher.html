<script>
/* ════════════════════════════════════════════════════════════════════
 *  מחלקת קשר — mockup of the Kesher module inside gdud-hub.
 *  Same shell, tokens and components as לוגיסטיקה / דוח 1 (tzelem.css).
 *  All names and צ׳ numbers below are made up.
 * ════════════════════════════════════════════════════════════════════ */

/* ── icons: the @gdud/ui set (SF-Symbols-style line icons) ── */
const PATHS = {
  home: '<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',

  list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14c2.4.2 4 1.8 4.5 4.5"/>',
  antenna: '<path d="M12 11v9M9 20h6"/><circle cx="12" cy="9" r="1.6"/><path d="M8.5 5.5a5 5 0 0 0 0 7M15.5 5.5a5 5 0 0 1 0 7M6 3a8.5 8.5 0 0 0 0 12M18 3a8.5 8.5 0 0 1 0 12"/>',
  person: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  chevron: '<path d="m14.5 6-6 6 6 6"/>',
  logout: '<path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M15 8l4 4-4 4M19 12H9"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  undo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
  refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>',
  flag: '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M9 4v16"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  doc: '<path d="M7 3h7l5 5v11.5A1.5 1.5 0 0 1 17.5 21h-10A1.5 1.5 0 0 1 6 19.5v-15A1.5 1.5 0 0 1 7.5 3z"/><path d="M14 3v5h5M9.5 13h5M9.5 16.5h5"/>',
  swap: '<path d="M7 4L3 8l4 4M3 8h14"/><path d="M17 20l4-4-4-4M21 16H7"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v4.5M12 18v.01"/>',
  print: '<path d="M7 9V3.5h10V9"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/>',
  more: '<circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/>',
  upload: '<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>',
  report: '<rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M8.3 10.5l2.2 2.2 4.6-4.6M8.3 16.5h7.4"/>',
  apps: '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M17 14v6M14 17h6"/>',
  send: '<path d="M21 3 10.5 13.5"/><path d="M21 3l-6.5 18-4-7.5-7.5-4z"/>',
  archive: '<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/>',
  tree: '<rect x="9" y="3.5" width="6" height="4.5" rx="1"/><rect x="3.5" y="16" width="6" height="4.5" rx="1"/><rect x="14.5" y="16" width="6" height="4.5" rx="1"/><path d="M12 8v4M6.5 16v-4h11v4"/>',
};
const ic = (n, s = 24, cls = '') =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s <= 20 ? 2 : 1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="${cls}">${PATHS[n]}</svg>`;
const tile = (color, icon, size = 30) =>
  `<span class="stile" style="width:${size}px;height:${size}px;border-radius:${size > 24 ? 7 : 6}px;background:${color}">${ic(icon, size > 24 ? 17 : 13)}</span>`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const num = (n) => Number(n).toLocaleString('he-IL');
const ser = (s) => `<span class="tz-serial">${esc(s)}</span>`;
const initials = (name) => name.split(' ').map((w) => w[0]).join('').slice(0, 2);

/* ── made-up data in the shape of the sheet ── */
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pickOne = (a) => a[Math.floor(rnd() * a.length)];

const COMPANIES = ['פלס״ר', 'עיט', 'פלנ״ט', 'פלחה״ן', 'מסייעת', 'פלת״צ', 'מפג״ד', 'מפקדה'];
const QUOTA = { 'פלס״ר': 26, 'עיט': 12, 'פלנ״ט': 45, 'פלחה״ן': 39, 'מסייעת': 41, 'פלת״צ': 8, 'מפג״ד': 35, 'מפקדה': 21 };
const WAREHOUSE = 'במחסן';
const TYPES = [['710', 100], ['אולר', 80], ['מדיה נתיקה', 20], ['אולר רשתי', 19], ['נר לילה', 17], ['מגן מכלול', 17], ['מודם לשקדון', 14], ['שקדון', 12], ['מחשב / טאבלט', 11], ['מב״ן', 10], ['סלצ', 10], ['RPT', 4], ['טל׳ 88', 4], ['אלעד ירוק', 4], ['מחשב 55ג', 4]];
const FIRST = ['יונתן', 'עומר', 'אורי', 'נועם', 'איתי', 'דניאל', 'רון', 'עידו', 'אלון', 'יובל', 'תומר', 'גיל', 'עמית', 'אביב', 'שחר', 'ליאור', 'בן', 'אריאל', 'מתן', 'רועי'];
const LAST = ['לוי', 'כהן', 'ביטון', 'פרץ', 'אברהם', 'מזרחי', 'שלום', 'פרידמן', 'דהן', 'אזולאי', 'חדד', 'סויסה', 'גבאי', 'אוחיון', 'קליין', 'רוזן'];
const ROLES = ['מ״פ', 'סמ״פ', 'מ״מ', 'סמל', 'קשר מ״פ', 'קשר מ״מ', 'מפקצ', 'לוחם'];
const FRAMES = ['חפ״ק', 'צוות 1', 'צוות 2', 'צוות 3', 'צוות 4', 'מוצב', 'עמדה מזרחית'];
const person = () => `${pickOne(FIRST)} ${pickOne(LAST)}`;

const used = new Set();
const SERIALS = [];
for (const [type, n] of TYPES) for (let i = 0; i < n; i++) {
  let s; do { s = String(type === '710' ? 489000 + Math.floor(rnd() * 3000) : 1100000 + Math.floor(rnd() * 99999)); } while (used.has(s));
  used.add(s);
  SERIALS.push({ id: s, s, type, loc: WAREHOUSE, g: '', h: '', i: '', note: '' });
}
// spread over the companies, the rest stays in the warehouse, 3 with no location
const shuffled = [...SERIALS].sort(() => rnd() - 0.5);
let k = 0;
for (const c of COMPANIES) for (let i = 0; i < QUOTA[c]; i++) {
  const x = shuffled[k++]; x.loc = c;
  if (rnd() < 0.84) { x.g = person(); x.h = pickOne(ROLES); x.i = rnd() < 0.8 ? pickOne(FRAMES) : ''; }
}
for (let i = 0; i < 3; i++) shuffled[k++].loc = '';
SERIALS.sort((a, b) => (a.type === b.type ? (a.s < b.s ? -1 : 1) : a.type < b.type ? -1 : 1));
const BY_ID = new Map(SERIALS.map((x) => [x.id, x]));

const TODAY = '27.10.2026';
const daysAgo = (d) => { const dt = new Date(2026, 9, 27 - d); return `${String(dt.getDate()).padStart(2, '0')}.${String(dt.getMonth() + 1).padStart(2, '0')}`; };

/* last דוח צ׳ per company: { ago (days), by, missing: [serial ids] } */
const REPORTS = {};
const repSpec = { 'פלס״ר': [0, 0], 'פלנ״ט': [3, 3], 'פלחה״ן': [9, 0], 'מפג״ד': [1, 0], 'מפקדה': [5, 1], 'עיט': [2, 0] };
for (const [c, [ago, miss]] of Object.entries(repSpec)) {
  const mine = SERIALS.filter((x) => x.loc === c);
  REPORTS[c] = { ago, when: `${daysAgo(ago)} · ${ago ? '18:40' : '08:55'}`, by: person(), total: mine.length, missing: mine.slice(2, 2 + miss).map((x) => x.id) };
  for (const x of mine) x.checked = { ago, ok: !REPORTS[c].missing.includes(x.id) };
}

/* ציוד משלים — counts per company from the sheet's כללי tab (rounded / trimmed) */
const STOCK = [
  ['סוללות 91', 'סוללות', [4, 2, 16, 18, 12, 0, 8, 0], 133, 210],
  ['סוללות קטנות', 'סוללות', [48, 4, 56, 51, 25, 0, 29, 13], 256, 500],
  ['סוללה לסלצ', 'סוללות', [4, 0, 2, 2, 6, 0, 4, 4], 6, 20],
  ['מעד', 'שמע', [12, 1, 17, 16, 14, 0, 12, 7], 25, 110],
  ['רמק', 'שמע', [3, 0, 3, 2, 14, 0, 9, 6], 2, 40],
  ['גנטקס', 'שמע', [0, 0, 0, 0, 35, 0, 0, 0], 0, 20],
  ['פת לב', 'שמע', [0, 0, 0, 0, 35, 0, 0, 0], 0, 20],
  ['אנט שוט', 'אנטנות', [12, 0, 12, 13, 6, 0, 9, 5], 31, 95],
  ['אנטנה שחורה', 'אנטנות', [2, 0, 2, 1, 7, 0, 3, 4], 1, 17],
  ['אנטנה לבנה חלק עליון', 'אנטנות', [2, 0, 2, 1, 7, 0, 3, 0], 9, 26],
  ['אנטנה לבנה חלק תחתון', 'אנטנות', [2, 0, 2, 1, 7, 0, 2, 0], 10, 26],
  ['מתאם גמיש', 'מתאמים ופתילים', [12, 0, 12, 13, 5, 0, 9, 5], 27, 90],
  ['מתאם תפוח', 'מתאמים ופתילים', [2, 1, 4, 4, 3, 0, 4, 0], 25, 43],
  ['מתאם אגס', 'מתאמים ופתילים', [2, 1, 3, 3, 3, 0, 4, 0], 26, 42],
  ['מתאם קשיח', 'מתאמים ופתילים', [2, 1, 4, 4, 3, 0, 4, 0], 22, 40],
  ['BNC', 'מתאמים ופתילים', [2, 1, 2, 6, 1, 0, 8, 0], 28, 50],
  ['271', 'מתאמים ופתילים', [0, 1, 3, 4, 3, 0, 4, 0], 30, 45],
  ['פתיל Y', 'מתאמים ופתילים', [0, 0, 2, 2, 0, 0, 4, 0], 7, 15],
  ['מגבר', 'מגברים ומטענים', [2, 1, 3, 2, 2, 0, 4, 0], 19, 33],
  ['מטען סוללות קטן', 'מגברים ומטענים', [1, 0, 1, 1, 1, 0, 1, 0], 5, 10],
  ['מטען סוללות גדול', 'מגברים ומטענים', [1, 0, 2, 1, 1, 0, 0, 0], 3, 8],
  ['כיסוי לסלצ', 'מגברים ומטענים', [1, 0, 1, 1, 2, 0, 2, 2], 0, 9],
].map(([name, cat, by, wh, brigade]) => {
  // מלאי חטיבה: equal to what we hold, except two rows that show the "מעל" flag
  const total = wh + by.reduce((a, b) => a + b, 0);
  return { name, cat, wh, brigade: ['גנטקס', 'כיסוי לסלצ'].includes(name) ? brigade : total, by: Object.fromEntries(COMPANIES.map((c, i) => [c, by[i]])) };
});
const STOCK_BY = new Map(STOCK.map((x) => [x.name, x]));

/* תקן ציוד משלים — what gets signed with each item; an item in a kit can have a kit of its own (מגבר) */
const KITS = {
  '710': [['סוללות קטנות', 4], ['מעד', 1], ['אנט שוט', 1], ['מתאם גמיש', 1]],
  'מגן מכלול': [['אנטנה שחורה', 1], ['אנטנה לבנה חלק עליון', 1], ['אנטנה לבנה חלק תחתון', 1], ['רמק', 2], ['מעד', 1]],
  'סלצ': [['סוללה לסלצ', 2], ['כיסוי לסלצ', 1]],
  'מגבר': [['סוללות 91', 2], ['מתאם תפוח', 1], ['מתאם אגס', 1], ['מתאם קשיח', 1], ['271', 1], ['BNC', 1]],
};
function expandKit(counts) {
  const out = {};
  const add = (item, q, depth = 0) => {
    out[item] = (out[item] || 0) + q;
    if (depth < 4) for (const [sub, n] of KITS[item] || []) add(sub, q * n, depth + 1);
  };
  for (const [type, n] of Object.entries(counts)) for (const [item, q] of KITS[type] || []) add(item, q * n);
  return out;
}

/* יומן חתימות */
const ACTIONS = ['החתמה', 'החתמה', 'החתמה', 'שיוך בפלוגה', 'זיכוי', 'קליטה ראשונית'];
const ISSUERS = ['שרון אלמוג', 'טל ברק', 'נדב אורן'];
const LOG = [];
for (let i = 0; i < 46; i++) {
  const action = pickOne(ACTIONS);
  const x = pickOne(SERIALS.filter((s) => s.loc && s.loc !== WAREHOUSE));
  const ago = Math.floor(i / 3.2);
  const withSerial = action === 'שיוך בפלוגה' || rnd() < 0.65;
  LOG.push({
    ago, when: `${daysAgo(ago)} · ${String(8 + Math.floor(rnd() * 12)).padStart(2, '0')}:${String(Math.floor(rnd() * 60)).padStart(2, '0')}`,
    company: x.loc, soldier: x.g || person(), role: x.h || pickOne(ROLES), issuer: pickOne(ISSUERS), action,
    item: withSerial ? x.type : pickOne(STOCK).name, serial: withSerial ? x.s : '', qty: withSerial ? 1 : 1 + Math.floor(rnd() * 6),
  });
}

/* ── state ── */
const ME = { name: 'שרון אלמוג', role: 'מנהל', admin: true };
const ST = {
  serials: { q: '', f: '', sel: '' },
  company: { tab: 'serials', q: '', edit: new Set(), groups: new Set(), vals: {} },
  stock: { tab: 'stock', q: '', col: '', edits: {} },
  log: { tab: 'sign', q: '', company: '', action: '' },
  sign: { company: '', soldier: '', role: '', issuer: ME.name, date: '2026-10-27', q: '', type: '', open: new Set(['710']), picked: new Set(), manual: {}, edited: {} },
  credit: { company: 'פלנ״ט', picked: new Set(), comp: {}, who: ME.name, note: '' },
  intake: { company: '', soldier: '', role: '', issuer: ME.name, rows: [{ type: '710', s: '' }, { type: '710', s: '' }] },
  check: { company: '', on: new Set(), reporter: '', note: '' },
};

/* ── shell ── */
const NAV = [
  { items: [
    { id: 'home', label: 'סקירה', icon: 'home' },
    { id: 'companies', label: 'פלוגות', icon: 'people' },
    { id: 'serials', label: 'צ׳ במערכת', short: 'צ׳', icon: 'list', badge: () => num(SERIALS.length) },
    { id: 'stock', label: 'ציוד משלים', short: 'משלים', icon: 'box' },
    { id: 'log', label: 'יומן', icon: 'clock' },
  ] },
  { title: 'פעולות', items: [
    { id: 'sign', label: 'החתמה', icon: 'pencil' },
    { id: 'credit', label: 'זיכוי', icon: 'undo' },
    { id: 'intake', label: 'קליטה ראשונית', short: 'קליטה', icon: 'plus' },
    { id: 'check', label: 'דוח צ׳', icon: 'report', badge: () => COMPANIES.filter((c) => !REPORTS[c] || REPORTS[c].ago > 7).length || '' },
    { id: 'import', label: 'ייבוא מהגיליון', short: 'ייבוא', icon: 'upload' },
  ] },
];
const PHONE_TABS = ['home', 'companies', 'serials', 'check'];
const ALL_NAV = NAV.flatMap((g) => g.items);

function route() {
  const [path, query] = location.hash.replace(/^#\/?/, '').split('?');
  const [page, arg] = path.split('/');
  return { page: page || 'home', arg: arg ? decodeURIComponent(arg) : '', q: new URLSearchParams(query || '') };
}
const href = (page, arg) => `#/${page}${arg ? '/' + encodeURIComponent(arg) : ''}`;

function shell() {
  const { page } = route();
  const navLink = (it) => `<a class="tz-app-link" href="${href(it.id)}" ${page === it.id ? 'aria-current="page"' : ''}>${ic(it.icon, 19)}<span class="grow truncate">${it.label}</span>${it.badge && it.badge() !== '' ? `<span class="tz-app-badge">${it.badge()}</span>` : ''}</a>`;
  const tabs = PHONE_TABS.map((id) => ALL_NAV.find((n) => n.id === id));
  const rest = ALL_NAV.filter((n) => !PHONE_TABS.includes(n.id));
  return `
  <aside class="tz-app-side" aria-label="מחלקת קשר">
    <a href="#" class="tz-app-back" onclick="return false">${ic('chevron', 16)}כל המחלקות</a>
    <div class="tz-app-brand">
      <span class="tz-app-mark">${ic('antenna', 19)}</span>
      <span class="col" style="min-width:0"><span class="tz-app-name truncate">מחלקת קשר</span><span class="tz-app-sub truncate">פיזור צ׳, החתמות ומלאי</span></span>
    </div>
    <form class="tz-app-search" role="search" onsubmit="event.preventDefault(); ST.serials.q=this.q.value; location.hash='#/serials'; render();">
      ${ic('search', 15)}<input type="search" name="q" placeholder="חיפוש צ׳, מכשיר או חותם" aria-label="חיפוש צ׳, מכשיר או חותם" autocomplete="off">
    </form>
    ${NAV.map((g) => `<nav class="tz-app-nav" aria-label="${g.title || 'ניווט'}">${g.title ? `<span class="tz-app-group">${g.title}</span>` : ''}${g.items.map(navLink).join('')}</nav>`).join('')}
    <div class="col gap2" style="margin-top:auto">
      <div class="tz-app-user">
        <span class="tz-avatar">${initials(ME.name)}</span>
        <span class="col grow" style="gap:2px"><span class="truncate semi" style="font-size:13px">${ME.name}</span><span class="tz-app-role">${ME.role}</span></span>
        <button class="tz-icon-btn" aria-label="יציאה" title="יציאה">${ic('logout', 19)}</button>
      </div>
    </div>
  </aside>
  <header class="tz-app-top">
    <span class="tz-app-mark">${ic('antenna', 17)}</span>
    <span class="col grow"><span class="truncate" style="font-size:15px;font-weight:700;line-height:20px">מחלקת קשר</span><span class="tz-app-sub truncate">פיזור צ׳, החתמות ומלאי</span></span>
    <a href="${href('serials')}" class="tz-icon-btn" aria-label="חיפוש">${ic('search', 20)}</a>
    <a href="#" onclick="return false" class="tz-icon-btn" aria-label="כל המחלקות">${ic('apps', 21)}</a>
  </header>
  <main class="tz-app-main" id="main"></main>
  <nav class="tz-tabs tabs-fixed" aria-label="מחלקת קשר">
    ${tabs.map((it) => `<a class="tz-tab" href="${href(it.id)}" ${page === it.id ? 'aria-current="page"' : ''}>${ic(it.icon, 25)}<span class="truncate" style="max-width:100%">${it.short || it.label}</span></a>`).join('')}
    <button type="button" class="tz-tab" style="border:0;background:transparent" ${rest.some((r) => r.id === page) ? 'aria-current="page"' : ''} onclick="openMore()">${ic('more', 25)}<span>עוד</span></button>
  </nav>
  <div id="more"></div>`;
}
function openMore() {
  const rest = ALL_NAV.filter((n) => !PHONE_TABS.includes(n.id));
  document.getElementById('more').innerHTML = `
    <button type="button" class="tz-scrim" aria-label="סגירה" onclick="closeMore()"></button>
    <div class="tz-sheet" role="dialog" aria-modal="true" aria-label="עוד">
      <div class="tz-grabber"></div>
      <div class="tz-group" style="margin:0 16px">${rest.map((it) => `<a class="tz-row" href="${href(it.id)}" onclick="closeMore()">${tile('var(--primary)', it.icon)}<span class="tz-row-body"><span class="tz-row-title">${it.label}</span>${ic('chevron', 17, 'tz-chevron')}</span></a>`).join('')}</div>
    </div>`;
}
function closeMore() { document.getElementById('more').innerHTML = ''; }

function toast(text) {
  const t = document.getElementById('toast');
  t.innerHTML = `<div class="tz-toast" role="status">${ic('check', 18)}<span>${esc(text)}</span><button onclick="this.parentNode.remove()">סגירה</button></div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.innerHTML = ''), 3500);
}

/* ── shared bits ── */
const header = (title, sub, actions = '') => `<div class="hdr"><div class="hdr-t"><h1 class="tz-title">${title}</h1>${sub ? `<span class="tz-footnote">${sub}</span>` : ''}</div>${actions ? `<div class="acts">${actions}</div>` : ''}</div>`;
const panel = (title, body, action = '', bodyStyle = '') => `<section class="panel">${title || action ? `<div class="panel-head">${title ? `<h2 class="tz-panel-title">${title}</h2>` : '<span></span>'}${action}</div>` : ''}<div class="tz-card" style="overflow:hidden;${bodyStyle}">${body}</div></section>`;
const kpi = (value, label, t, to) => `<${to ? `a href="${to}"` : 'div'} class="tz-kpi">${t}<span><span class="tz-kpi-value tz-num">${value}</span><span class="tz-kpi-label">${label}</span></span></${to ? 'a' : 'div'}>`;
const btn = (label, { kind = 'tinted', icon, to, on, sm = true, dis } = {}) =>
  to ? `<a href="${to}" class="tz-btn tz-btn-${kind} ${sm ? 'tz-btn-sm' : ''}">${icon ? ic(icon, 16) : ''}${label}</a>`
     : `<button type="button" class="tz-btn tz-btn-${kind} ${sm ? 'tz-btn-sm' : ''}" ${on ? `onclick="${on}"` : ''} ${dis ? 'disabled' : ''}>${icon ? ic(icon, 16) : ''}${label}</button>`;
const empty = (t) => `<div style="padding:24px;text-align:center;font-size:15px;color:var(--ink-muted)">${t}</div>`;
const pills = (opts, cur, on) => `<nav class="tz-pills" aria-label="סינון">${opts.map(([v, l, n]) => `<button type="button" class="tz-pill" ${cur === v ? 'aria-current="page"' : ''} onclick="${on}('${v}')">${l}${n !== undefined ? ` <span class="tz-pill-count">${n}</span>` : ''}</button>`).join('')}</nav>`;
const seg = (opts, cur, on) => `<div class="tz-seg seg-w" role="tablist">${opts.map(([v, l]) => `<button role="tab" class="tz-seg-item" aria-selected="${cur === v}" onclick="${on}('${v}')">${l}</button>`).join('')}</div>`;
const sel = (id, label, opts, cur, on, none = 'הכל') => `<label class="tz-field" style="min-width:150px"><span class="tz-label">${label}</span><select class="tz-input" id="${id}" onchange="${on}">${none !== null ? `<option value="">${none}</option>` : ''}${opts.map((o) => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
const field = (label, input) => `<label class="tz-field"><span class="tz-label">${label}</span>${input}</label>`;
const step = (n, t) => `<div class="flex center gap2"><span class="tz-step">${n}</span><h2 class="tz-headline">${t}</h2></div>`;

function locChip(x) {
  if (x.loc === WAREHOUSE) return '<span class="tz-chip tz-chip-ok">במחסן</span>';
  if (!x.loc) return '<span class="tz-chip tz-chip-broken">ללא שיוך</span>';
  return `<span class="tz-chip tz-chip-signed">${esc(x.loc)}</span>`;
}
function checkChip(x) {
  if (!x.checked) return '<span class="xs muted">לא נבדק</span>';
  if (!x.checked.ok) return '<span class="tz-chip tz-chip-broken">לא נמצא</span>';
  return `<span class="xs ${x.checked.ago > 7 ? 'muted' : ''}">${x.checked.ago === 0 ? 'היום' : `לפני ${x.checked.ago} ימים`}</span>`;
}
function reportChip(c) {
  const r = REPORTS[c];
  if (!r) return '<span class="tz-chip tz-chip-broken">לא הוגש</span>';
  if (r.missing.length) return `<span class="tz-chip tz-chip-broken">${r.missing.length} לא נמצאו</span>`;
  if (r.ago > 7) return `<span class="tz-chip tz-chip-admin">ישן · ${r.ago} ימים</span>`;
  return '<span class="tz-chip tz-chip-ok">תקין</span>';
}
const inCompany = (c) => SERIALS.filter((x) => x.loc === c);
const assigned = (c) => inCompany(c).filter((x) => x.g).length;
const compTotal = (c) => STOCK.reduce((t, s) => t + s.by[c], 0);
const meter = (a, b) => `<span class="flex center gap2"><span class="tz-meter" style="width:72px"><span style="width:${b ? Math.round((a / b) * 100) : 0}%"></span></span><span class="xs muted tz-num">${a}/${b}</span></span>`;

function logTable(rows, compact) {
  if (!rows.length) return empty('אין רישום תואם');
  return `<table class="tz-table"><thead><tr><th>מתי</th><th>פלוגה</th><th>חותם</th>${compact ? '' : '<th>מחתים</th>'}<th>פריט</th>${compact ? '' : '<th>כמות</th>'}<th>פעולה</th></tr></thead><tbody>${rows.map((r) => `
    <tr><td class="muted">${r.when}</td><td>${esc(r.company)}</td><td>${esc(r.soldier)}${compact ? '' : `<span class="tz-row-sub xs">${esc(r.role)}</span>`}</td>${compact ? '' : `<td>${esc(r.issuer)}</td>`}
    <td>${esc(r.item)}${r.serial ? ' ' + ser(r.serial) : ''}</td>${compact ? '' : `<td class="tz-num">${r.qty}</td>`}<td><span class="tz-chip ${r.action === 'זיכוי' ? 'tz-chip-brigade' : r.action === 'קליטה ראשונית' ? 'tz-chip-ok' : 'tz-chip-signed'}">${r.action}</span></td></tr>`).join('')}</tbody></table>`;
}

/* ════════════════ screens ════════════════ */
const SCREENS = {};

/* ── סקירה ── */
SCREENS.home = () => {
  const wh = SERIALS.filter((x) => x.loc === WAREHOUSE).length;
  const none = SERIALS.filter((x) => !x.loc).length;
  const out = SERIALS.length - wh - none;
  const checked7 = SERIALS.filter((x) => x.checked && x.checked.ago <= 7 && x.checked.ok).length;
  const low = STOCK.filter((s) => s.wh <= 1).sort((a, b) => a.wh - b.wh);
  const attention = [];
  if (none) attention.push([href('serials') + '?f=none', tile('var(--tile-broken)', 'alert', 28), `${none} צ׳ ללא שיוך`, 'לא במחסן ולא על פלוגה — לשייך או לבדוק']);
  for (const c of COMPANIES) {
    const r = REPORTS[c];
    if (!r) attention.push([href('check', c), tile('var(--tile-document)', 'report', 28), `${c} — לא הוגש דוח צ׳`, `${inCompany(c).length} צ׳ על הפלוגה`]);
    else if (r.missing.length) attention.push([href('companies', c), tile('var(--tile-document)', 'alert', 28), `${c} — ${r.missing.length} צ׳ לא נמצאו`, `בדוח מ־${r.when} · ${esc(r.by)}`]);
    else if (r.ago > 7) attention.push([href('check', c), tile('var(--tile-neutral)', 'clock', 28), `${c} — דוח צ׳ לפני ${r.ago} ימים`, 'הגיע הזמן לבדיקה חוזרת']);
  }
  const row = ([to, t, title, sub]) => `<a href="${to}" class="tz-row">${t}<span class="tz-row-body"><span class="tz-row-title md">${title}<span class="tz-row-sub xs">${sub}</span></span>${ic('chevron', 15, 'tz-chevron')}</span></a>`;

  return header('סקירה', `${num(SERIALS.length)} צ׳ בגדוד · ${STOCK.length} סוגי ציוד משלים · עודכן היום 09:12`,
    btn('דוח צ׳', { icon: 'report', to: href('check') }) + btn('זיכוי', { icon: 'undo', to: href('credit') }) + btn('החתמה', { kind: 'filled', icon: 'pencil', to: href('sign') })) + `
  <div class="cols">
    <div class="col-main">
      ${panel('פיזור הצ׳', `
        <div class="col gap2" style="padding:14px 16px 12px;border-bottom:1px solid var(--separator)">
          <div class="tz-bar" style="height:8px"><span class="ok" style="flex:${wh}"></span><span style="flex:${out};background:var(--primary)"></span><span class="broken" style="flex:${none}"></span></div>
          <span class="xs muted">${Math.round((out / SERIALS.length) * 100)}% מהצ׳ על הפלוגות · ${Math.round((wh / SERIALS.length) * 100)}% במחסן</span>
        </div>
        <div class="kpis">
          ${kpi(num(wh), 'במחסן', tile('var(--tile-ok)', 'box'), href('serials') + '?f=wh')}
          ${kpi(num(out), 'על הפלוגות', tile('var(--primary)', 'people'), href('companies'))}
          ${kpi(num(none), 'ללא שיוך', tile('var(--tile-broken)', 'alert'), href('serials') + '?f=none')}
          ${kpi(`${num(checked7)}<span class="muted" style="font-size:14px;font-weight:400"> / ${num(out)}</span>`, 'נראו בעין ב־7 ימים', tile('var(--tile-brigade)', 'check'), href('log') + '?tab=rep')}
        </div>`, `<a href="${href('serials')}" class="link">לכל הצ׳</a>`)}
      ${panel('פלוגות', `<div style="overflow-x:auto"><table class="tz-table"><thead><tr><th>פלוגה</th><th>צ׳</th><th>משויכים בפלוגה</th><th>דוח צ׳ אחרון</th><th class="md-hide">ציוד משלים</th></tr></thead><tbody>
        ${COMPANIES.map((c) => `<tr class="tz-hover" onclick="location.hash='${href('companies', c)}'"><th scope="row" class="semi">${c}</th><td class="tz-num">${inCompany(c).length}</td><td>${meter(assigned(c), inCompany(c).length)}</td><td><span class="flex center gap2">${reportChip(c)}${REPORTS[c] ? `<span class="xs muted">${REPORTS[c].when.split(' · ')[0]}</span>` : ''}</span></td><td class="tz-num md-hide ${compTotal(c) ? '' : 'tz-zero'}">${num(compTotal(c))}</td></tr>`).join('')}
        </tbody><tfoot><tr><th>סה״כ</th><td class="tz-num">${num(out)}</td><td>${meter(COMPANIES.reduce((t, c) => t + assigned(c), 0), out)}</td><td></td><td class="tz-num md-hide">${num(COMPANIES.reduce((t, c) => t + compTotal(c), 0))}</td></tr></tfoot></table></div>`)}
      ${panel('חתימות אחרונות', `<div style="overflow-x:auto">${logTable(LOG.slice(0, 7), true)}</div>`, `<a href="${href('log')}" class="link">ליומן המלא</a>`)}
    </div>
    <div class="col-side">
      ${panel('דורש טיפול', attention.map(row).join('') || empty('הכל תקין'))}
      ${panel('ציוד משלים בחוסר במחסן', low.map((s) => `<a href="${href('stock')}" class="tz-row"><span class="tz-row-body" style="min-height:42px;padding-block:0"><span class="tz-row-title md">${s.name}<span class="tz-row-sub xs">${s.cat}</span></span><span class="tz-num miss md">${s.wh}</span>${ic('chevron', 14, 'tz-chevron')}</span></a>`).join(''), `<span class="xs muted">במחסן</span>`)}
      ${panel('הפקת דוחות', `
        <button class="tz-row" onclick="openExport('פיזור צ׳ כללי')">${tile('var(--tile-document)', 'doc', 28)}<span class="tz-row-body"><span class="tz-row-title md">פיזור צ׳ כללי<span class="tz-row-sub xs">PDF להדפסה או Excel · כל הגדוד או פלוגה</span></span>${ic('chevron', 15, 'tz-chevron')}</span></button>
        <button class="tz-row" onclick="openExport('רשימת ציוד פלוגתית')">${tile('var(--primary)', 'print', 28)}<span class="tz-row-body"><span class="tz-row-title md">רשימת ציוד פלוגתית<span class="tz-row-sub xs">לפי חותם, עם הציוד המשלים ושורת אישור קבלה</span></span>${ic('chevron', 15, 'tz-chevron')}</span></button>`)}
    </div>
  </div>`;
};

/* ── פלוגות ── */
SCREENS.companies = (arg) => {
  const c = arg || COMPANIES[2];
  const C = ST.company;
  if (C.c !== c) Object.assign(C, { c, q: '', edit: new Set(), groups: new Set(), vals: {} });
  const list = inCompany(c);
  const r = REPORTS[c];
  const repCard = `<div class="tz-card flex wrap center gap3" style="padding:14px 16px">
      ${tile(r && !r.missing.length && r.ago <= 7 ? 'var(--tile-ok)' : 'var(--tile-document)', 'report')}
      <span class="col grow" style="min-width:200px"><span class="flex center gap2"><span class="semi">דוח צ׳ אחרון</span>${reportChip(c)}</span>
      <span class="sm muted">${r ? `${r.when} · ${esc(r.by)} · ${r.total - r.missing.length}/${r.total} נראו בעין${r.missing.length ? ` · לא נמצאו: ${r.missing.map((id) => ser(id)).join(', ')}` : ''}` : 'עדיין לא הוגש דוח צ׳ לפלוגה'}</span></span>
      ${btn('דוח צ׳ חדש', { kind: 'filled', icon: 'report', to: href('check', c) })}
    </div>`;
  return `<nav class="tz-pills" aria-label="פלוגות">${COMPANIES.map((x) => `<a class="tz-pill" href="${href('companies', x)}" ${x === c ? 'aria-current="page"' : ''}>${x} <span class="tz-pill-count">${inCompany(x).length}</span></a>`).join('')}</nav>
  ${header(c, `${list.length} צ׳ · ${assigned(c)} משויכים לחותם בתוך הפלוגה · ${num(compTotal(c))} פריטי ציוד משלים`,
    btn('רשימת ציוד להדפסה', { icon: 'print', on: `openExport('רשימת ציוד פלוגתית','${c}')` }) + btn('החתמה לפלוגה', { kind: 'filled', icon: 'pencil', on: `ST.sign.company='${c}';location.hash='${href('sign')}'` }))}
  ${repCard}
  <div class="flex wrap center gap3">${seg([['serials', `צ׳ (${list.length})`], ['comp', 'ציוד משלים']], C.tab, 'setCompanyTab')}
    ${C.tab === 'serials' ? `<label class="tz-search search-surface">${ic('search', 15)}<input type="search" placeholder="סינון לפי צ׳, מכשיר או חותם" value="${esc(C.q)}" oninput="ST.company.q=this.value; paintCompany()"></label>` : ''}</div>
  <div id="cobody"></div>`;
};
SCREENS.companies.after = () => paintCompany();
function setCompanyTab(t) { ST.company.tab = t; render(); }
function paintCompany() {
  const C = ST.company, c = C.c, el = document.getElementById('cobody');
  if (C.tab === 'comp') {
    const counts = {}; for (const x of inCompany(c)) counts[x.type] = (counts[x.type] || 0) + 1;
    const std = expandKit(counts);
    const rows = STOCK.filter((s) => s.by[c] || std[s.name]);
    el.innerHTML = `<div class="tz-table-wrap"><table class="tz-table"><thead><tr><th>פריט</th><th>קטגוריה</th><th>חתומים</th><th>לפי תקן</th><th>פער</th></tr></thead><tbody>${rows.map((s) => {
      const d = s.by[c] - (std[s.name] || 0);
      return `<tr><th scope="row">${s.name}</th><td class="muted">${s.cat}</td><td class="tz-num semi">${s.by[c]}</td><td class="tz-num ${std[s.name] ? '' : 'tz-zero'}">${std[s.name] || 0}</td><td class="tz-num">${d === 0 ? '<span class="tz-zero">—</span>' : d < 0 ? `<span class="miss">${d}</span>` : `+${d}`}</td></tr>`;
    }).join('')}</tbody></table></div><p class="tz-section-footer">"לפי תקן" מחושב מהצ׳ שעל הפלוגה ומטבלת תקן הציוד המשלים. פער שלילי = הפלוגה חתומה על פחות מהתקן.</p>`;
    return;
  }
  const q = C.q.trim();

function paintCheck() {
  const S = ST.check, list = inCompany(S.company);
  document.querySelectorAll('.chk-row').forEach((el) => { const on = S.on.has(el.dataset.id); el.querySelector('input').checked = on; el.toggleAttribute('data-on', on); });
  const groups = {}; for (const x of list) (groups[x.type] = groups[x.type] || []).push(x);
  for (const [t, g] of Object.entries(groups)) { const el = document.getElementById('gc-' + t.replace(/\W/g, '_')); if (el) el.textContent = `${g.filter((x) => S.on.has(x.id)).length}/${g.length}`; }
  const n = list.filter((x) => S.on.has(x.id)).length;
  document.getElementById('chksum').textContent = n === list.length ? `כל ${list.length} הצ׳ נראו בעין` : `${n}/${list.length} נראו בעין · ${list.length - n} עוד לא`;
  document.getElementById('chkbar').style.width = `${list.length ? (n / list.length) * 100 : 0}%`;
  document.getElementById('chkgo').disabled = !S.reporter.trim();
}
function checkSubmit() {
  const S = ST.check, list = inCompany(S.company), miss = list.filter((x) => !S.on.has(x.id));
  if (!confirm(miss.length ? `לשלוח דוח עם ${miss.length} צ׳ שלא נמצאו? הדוח יישלח למנהלים עם הפירוט.` : `לשלוח דוח שכל ${list.length} הצ׳ של ${S.company} נראו בעין?`)) return;
  REPORTS[S.company] = { ago: 0, when: `${daysAgo(0)} · 09:40`, by: S.reporter, total: list.length, missing: miss.map((x) => x.id) };
  for (const x of list) x.checked = { ago: 0, ok: S.on.has(x.id) };
  const c = S.company; Object.assign(S, { company: '', on: new Set(), note: '' });
  location.hash = href('companies', c); toast(miss.length ? `הדוח נשלח · ${miss.length} לא נמצאו` : 'הדוח נשלח · הכל נמצא');
}

    ${panel('מה נקרא מהקובץ', `<ol class="tz-steps">${[
      ['פיזור צ כללי', 'כל הצ׳: סוג מכשיר, פלוגה / במחסן, הערות'],
      ['גיליון כל פלוגה', 'השיוך בתוך הפלוגה: חותם, תפקיד, מסגרת'],
      ['כללי', 'ציוד משלים: כמות במחסן ובכל פלוגה, מלאי קבלות חטיבה'],
      ['תקן ציוד משלים', 'מה נחתם יחד עם כל פריט'],
      ['יומן חתימות', 'היסטוריית החתמות, זיכויים ושיוכים'],
      ['דוחות צ׳ · בדיקות צ׳', 'דוחות הבדיקה העינית ומתי כל צ׳ נראה לאחרונה'],

  </div><div class="col-side">
    ${panel('לא מיובא', `<div class="pad sm"><span>"הרשאות אתר" וקודי הגישה — ההרשאות עוברות להרשאות של gdud-hub (מנהל / משתמש לכל מחלקה).</span><span>"טופס חתימה", "טופס קליטה ראשונית" ו"סינון יומנים" — הם מסכים באפליקציה.</span></div>`)}
  </div></div>`;

/* ── ייצוא (dialog) ── */
function openExport(kind, company = '') {
  document.getElementById('more').innerHTML = `
    <button type="button" class="tz-scrim" aria-label="סגירה" onclick="closeMore()"></button>
    <div class="tz-sheet" role="dialog" aria-modal="true" aria-label="${kind}">
      <div class="tz-grabber"></div>
      <div class="col gap3" style="padding:4px 16px 8px">
        <h2 class="tz-headline">${kind}</h2>
        ${field('פלוגה', `<select class="tz-input">${kind === 'פיזור צ׳ כללי' ? '<option>כל הגדוד</option><option>במחסן</option>' : ''}${COMPANIES.map((c) => `<option ${c === company ? 'selected' : ''}>${c}</option>`).join('')}</select>`)}
        <div class="tz-seg" role="tablist"><button class="tz-seg-item" role="tab" aria-selected="true">PDF להדפסה</button><button class="tz-seg-item" role="tab" aria-selected="false">Excel</button></div>
        ${kind === 'פיזור צ׳ כללי' ? `<label class="flex center gap3 md"><input type="checkbox" role="switch" checked><span class="grow">רק עמודות שיש בהן נתונים</span></label>` : '<span class="tz-footnote">הצ׳ מקובצים לפי מי שחתום עליהם, ואחריהם הציוד המשלים בכמויות. בסוף — שורת אישור קבלה לחתימה.</span>'}
        <button class="tz-btn tz-btn-filled" onclick="closeMore();toast('הקובץ הופק (במוקאפ)')">${ic('doc', 18)}הפקה והורדה</button>
      </div>
    </div>`;
}

/* ── render ── */
function render() {
  document.getElementById('app').innerHTML = shell();
  const { page, arg, q } = route();
  const screen = SCREENS[page] || SCREENS.home;
  document.getElementById('main').innerHTML = screen(arg, q);
  screen.after && screen.after(arg, q);
  // the seg in ציוד משלים: wired here to keep the template simple
  if (page === 'stock') document.querySelectorAll('.tz-seg-item').forEach((b, i) => (b.onclick = () => setStockTab(i ? 'kits' : 'stock')));
  document.title = `${(ALL_NAV.find((n) => n.id === page) || ALL_NAV[0]).label} · מחלקת קשר · מוקאפ`;
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>
