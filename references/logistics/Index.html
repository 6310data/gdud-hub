<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>לוגיסטיקה גדודית</title>
<style>
  :root{
    --bg:#f3f5f7;--card:#fff;--ink:#17202a;--muted:#6b7785;--line:#e1e6eb;
    --brand:#2f5d3a;--brand-ink:#fff;--accent:#c98a1b;--danger:#b23a3a;--ok:#2e7d4f;
    --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif}
  body{padding-bottom:84px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  a{color:inherit}
  [hidden]{display:none!important}

  /* header */
  .top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .top h1{font-size:17px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;background:rgba(255,255,255,.12)}
  .top .ib:active{background:rgba(255,255,255,.28)}
  .top .badge{font-size:12px;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:999px}
  .spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

  .page{padding:14px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 10px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{min-width:0}
  .grow{flex:1}
  .right{text-align:right}.center{text-align:center}
  .mt{margin-top:10px}.mb{margin-bottom:10px}

  input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{
    width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:16px
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,93,58,.12)}
  textarea{min-height:80px;resize:vertical}
  .num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;min-height:46px}
  .btn:active{filter:brightness(.9)}
  .btn.full{width:100%}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  .btn.warn{background:var(--accent)}
  .btn.danger{background:var(--danger)}
  .btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
  .btn[disabled]{opacity:.45;pointer-events:none}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 12px;text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
  .tile .ic{font-size:28px}
  .tile .sub{font-size:12px;color:var(--muted);font-weight:400}
  .tile:active{transform:scale(.98)}
  .tile.admin{border:1.5px solid var(--brand)}

  .list{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);text-align:right;width:100%}
  .item:last-child{border-bottom:0}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .cnt{min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:#eef2ee;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px}
  .item .chev{color:#b7c0c9}
  .item:active{background:#f6f8f6}
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;background:#eef2ee;color:var(--brand);font-weight:600}
  .chip.store{background:#fff4dd;color:#8a5a00}
  .chip.gray{background:#eef0f2;color:#556}
  .chip.broken{background:#fde4e4;color:#9b2c2c}
  .chip.brig{background:#e4ecfb;color:#2b4a8b}
  .kit{margin:4px 34px 2px 0;padding-right:10px;border-right:2px solid #dfe5df;font-size:13px}
  .kit .kl{display:flex;align-items:center;gap:6px;padding:4px 0}
  .kit .kl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kit .qb{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:15px;display:grid;place-items:center}
  .kit .q{min-width:20px;text-align:center;font-weight:700}
  .kit .rm{color:var(--danger);font-size:16px;padding:0 4px}
  .kit .add{display:flex;gap:6px;margin-top:4px}
  .kit .add input{padding:7px 10px;font-size:14px;border-radius:9px}
  .kit .add input.qty{width:56px;text-align:center}
  .preview{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .item .t .chips{display:flex;gap:6px;flex-wrap:wrap}
  .item .t .chips .chip{display:inline-block;width:auto;white-space:nowrap}
  .chipbtn{padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px}
  .chipbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .check{width:24px;height:24px;border-radius:7px;border:2px solid #b7c0c9;display:grid;place-items:center;flex:none;font-size:15px;color:#fff}
  .check.on{background:var(--brand);border-color:var(--brand)}

  .sec{font-size:13px;color:var(--muted);font-weight:700;margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.02em}
  .empty{padding:24px;text-align:center;color:var(--muted)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
  .kv div:nth-child(odd){color:var(--muted)}

  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center}
  th{background:#f7f9f8;position:sticky;top:0;font-weight:700}
  th:first-child,td:first-child{position:sticky;right:0;background:#fff;text-align:right;z-index:1;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  th:first-child{background:#f7f9f8;z-index:2}
  td.z{color:#c3cad1}
  .tblwrap{overflow:auto;max-height:70vh;border-radius:10px;border:1px solid var(--line)}

  /* sticky bottom action bar */
  .bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  .bar .info{flex:1;font-size:14px}

  /* toast & overlay */
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:100;max-width:90vw;white-space:pre-line;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--ok)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:grid;place-items:end center}
  .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:760px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
  .sheet h3{margin:0 0 10px;font-size:17px}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:95;display:grid;place-items:center;font-weight:700;color:var(--brand)}

  .login{max-width:360px;margin:16vh auto 0;text-align:center}
  .login .logo{font-size:52px;margin-bottom:6px}
  .login h1{font-size:22px;margin:0 0 4px}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <button class="ib" id="btnBack" title="חזרה">‹</button>
  <h1 id="title">לוגיסטיקה גדודית</h1>
  <span class="badge" id="roleBadge"></span>
  <button class="ib" id="btnRefresh" title="משיכת נתונים">⟳</button>
  <button class="ib" id="btnHome" title="בית">⌂</button>
</header>

<main id="view" class="page"></main>
<div id="bar" class="bar" hidden></div>
<div id="toast" class="toast"></div>
<div id="busy" class="busy" hidden>טוען…</div>
<div id="overlay" class="overlay" hidden></div>

<script>
/* ======================================================================
   Server bridge – google.script.run wrapped in promises
   ====================================================================== */
var isGAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if(!isGAS){ // local dev shim
    return new Promise(function(res,rej){
      try{ if(window.MOCK && window.MOCK[fn]) res(window.MOCK[fn].apply(null,args)); else rej(new Error('no mock for '+fn)); }
      catch(e){ rej(e); }
    });
  }
  return new Promise(function(res,rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(new Error((e&&e.message)||String(e))); });
    r[fn].apply(r,args);
  });
}

/* ======================================================================
   State
   ====================================================================== */
var LS = { code:'bl_code', role:'bl_role', snap:'bl_snapshot', email:'bl_email', mode:'bl_mode', vce:'bl_vce' };
var S = {
  code: ls(LS.code) || '',
  role: ls(LS.role) || '',
  email: ls(LS.email) || '',
  mode: ls(LS.mode) || '',          // 'sheet' (Google sharing) | 'codes'
  vce: ls(LS.vce)==='1',            // viewer may edit soldier details (codes mode only)
  denied: '',                       // sheet mode: no-access message
  snap: null,
  idx: null,
  stack: [],          // navigation stack of {page, params}
  cart: {}            // signout cart: serial -> {item,serial,holder}
};
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function isAdmin(){ return S.role==='admin'; }
function canEditPerson(){ return isAdmin() || S.vce; }
function roleLabel(){ return isAdmin()?'מנהל':'צפייה'; }
function applyAuth(r){
  if(r.email && S.email && r.email!==S.email){ ls(LS.snap,null); S.snap=null; S.idx=null; }   // different Google account on this device
  S.role=r.role; S.mode=r.mode||S.mode; S.email=r.email||''; S.vce=!!r.viewerCanEditPeople; S.denied='';
  ls(LS.role,S.role); ls(LS.mode,S.mode); ls(LS.email,S.email); ls(LS.vce,S.vce?'1':'0');
}
function denyAccess(msg,email){
  S.role=''; S.denied=msg||'אין הרשאה'; if(email) S.email=email;
  ls(LS.role,null); ls(LS.snap,null); S.snap=null; S.idx=null; S.stack=[{page:'home',params:{}}];
  render();
}

/* ---------- indexes derived from snapshot ---------- */
var ST={SIGNED:'חתום',OK:'נשקייה תקין',BROKEN:'נשקייה תקול',BRIGADE:'נשקייה חטיבה'};
function stLabel(s){ return s===ST.OK?'תקין':s===ST.BROKEN?'תקול':s===ST.BRIGADE?'חטיבה':s===ST.SIGNED?'חתום':(s||'תקין'); }
function stChip(s){ var c=s===ST.BROKEN?'broken':s===ST.BRIGADE?'brig':s===ST.SIGNED?'':'store'; return h('span',{class:'chip '+c},[stLabel(s)]); }
function newItem_(cat,item){ return {cat:cat,item:item,total:0,signed:0,store:0,ok:0,broken:0,brigade:0}; }
function buildIndex(snap){
  var idx = { bySerial:{}, assignBySerial:{}, byPerson:{}, people:{}, byItem:{}, itemTypes:[], companies:[], unitsByCompany:{}, warehouse:[], kit:snap.kit||{} };
  snap.people.forEach(function(p){ idx.people[p.name]=p; });
  snap.serials.forEach(function(s){
    if(!s.serial) return;
    if(!s.status) s.status=ST.OK;
    if(!idx.bySerial[s.serial]) idx.bySerial[s.serial]=s;
    (idx.byItem[s.item] = idx.byItem[s.item] || newItem_(s.cat,s.item)).total++;
  });
  snap.assignments.forEach(function(a){
    if(a.serial) idx.assignBySerial[a.serial]=a;
    if(!idx.byPerson[a.name]) idx.byPerson[a.name]=[];
    idx.byPerson[a.name].push(a);
    if(!idx.people[a.name]) idx.people[a.name]={name:a.name,pid:a.pid,company:a.company,unit:a.unit,orphan:true};
    else { // prefer the sheet's resolved company/unit if directory lacks it
      if(!idx.people[a.name].company && a.company) idx.people[a.name].company=a.company;
      if(!idx.people[a.name].unit && a.unit) idx.people[a.name].unit=a.unit;
    }
    var it = idx.byItem[a.item] = idx.byItem[a.item] || newItem_('',a.item);
    it.signed++;
  });
  Object.keys(idx.bySerial).forEach(function(k){
    var s=idx.bySerial[k];
    if(idx.assignBySerial[k]) return;
    var it=idx.byItem[s.item];
    if(s.status===ST.BRIGADE){ it.brigade++; }
    else { it.store++; if(s.status===ST.BROKEN) it.broken++; else it.ok++; }
    idx.warehouse.push(s);
  });
  idx.warehouse.sort(function(a,b){ return a.item.localeCompare(b.item,'he') || a.serial.localeCompare(b.serial,'he',{numeric:true}); });
  // item types: catalogue ∪ observed
  var seen={};
  snap.items.forEach(function(i){ if(!seen[i.item]){ seen[i.item]=1; idx.itemTypes.push({item:i.item,cat:i.cat,sub:i.sub}); } });
  Object.keys(idx.byItem).forEach(function(k){ if(!seen[k]){ seen[k]=1; idx.itemTypes.push({item:k,cat:idx.byItem[k].cat,sub:''}); } });
  idx.itemTypes.sort(function(a,b){ return a.item.localeCompare(b.item,'he'); });
  // companies
  var cset={}; snap.companies.forEach(function(c){ cset[c]=1; });
  Object.keys(idx.people).forEach(function(n){ var c=idx.people[n].company; if(c) cset[c]=1; });
  idx.companies = Object.keys(cset);
  idx.companies.forEach(function(c){ idx.unitsByCompany[c]={}; });
  // storage (אפסון) – active rows only
  idx.storage=(snap.storage||[]).slice(); idx.storageBySerial={}; idx.storageByPerson={};
  idx.storage.forEach(function(r){ if(r.serial) idx.storageBySerial[r.serial]=r; (idx.storageByPerson[r.name]=idx.storageByPerson[r.name]||[]).push(r); if(r.company&&!cset[r.company]){ cset[r.company]=1; idx.companies.push(r.company); idx.unitsByCompany[r.company]={}; } });
  Object.keys(idx.people).forEach(function(n){ var p=idx.people[n]; if(p.company&&idx.unitsByCompany[p.company]){ var u=p.unit||'ללא מחלקה'; (idx.unitsByCompany[p.company][u]=idx.unitsByCompany[p.company][u]||[]).push(p); } });
  return idx;
}
function loadSnapLocal(){ try{ var s=ls(LS.snap); if(s){ S.snap=JSON.parse(s); S.idx=buildIndex(S.snap); return true; } }catch(e){} return false; }
function refresh(silent){
  var btn=el('btnRefresh'); btn.classList.add('spin');
  return call('getSnapshot',S.code).then(function(snap){
    applyAuth(snap);
    S.snap=snap; S.idx=buildIndex(snap); ls(LS.snap,JSON.stringify(snap));
    el('roleBadge').textContent = roleLabel();
    if(!silent) toast('הנתונים עודכנו','ok');
    render();
  }).catch(function(e){
    if(/קוד גישה/.test(e.message)){ logout(); }
    else if(/^אין הרשאה|לא ניתן לזהות/.test(e.message)){ return denyAccess(e.message); }
    toast(e.message,'err');
  }).finally(function(){ btn.classList.remove('spin'); });
}

/* ======================================================================
   Tiny DOM helpers
   ====================================================================== */
function el(id){ return document.getElementById(id); }
function h(tag, attrs, children){
  var e=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),attrs[k]);
    else if(k==='hidden'){ if(attrs[k]) e.hidden=true; }
    else if(k==='disabled'||k==='selected'||k==='checked'){ if(attrs[k]) e.setAttribute(k,''); }
    else if(attrs[k]===false||attrs[k]===null||attrs[k]===undefined){ /* skip */ }
    else e.setAttribute(k,attrs[k]);
  });
  (children||[]).forEach(function(c){ if(c===null||c===undefined||c===false) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var toastT;
function toast(msg,kind){ var t=el('toast'); t.textContent=msg; t.className='toast show '+(kind||''); clearTimeout(toastT); toastT=setTimeout(function(){ t.className='toast'; }, kind==='err'?4500:2200); }
function busy(on){ el('busy').hidden=!on; }
function sheet(title, body, actions){
  var ov=el('overlay'); ov.innerHTML=''; ov.hidden=false;
  var sh=h('div',{class:'sheet'},[h('h3',{},[title]), body, h('div',{class:'row mt'}, actions)]);
  ov.appendChild(sh);
  ov.onclick=function(e){ if(e.target===ov) closeSheet(); };
  return sh;
}
function closeSheet(){ el('overlay').hidden=true; el('overlay').innerHTML=''; }
function confirmSheet(title, text, okLabel, danger){
  return new Promise(function(res){
    sheet(title, h('p',{},[text]), [
      h('button',{class:'btn ghost grow',onclick:function(){ closeSheet(); res(false); }},['ביטול']),
      h('button',{class:'btn grow '+(danger?'danger':''),onclick:function(){ closeSheet(); res(true); }},[okLabel||'אישור'])
    ]);
  });
}
function norm(s){ return String(s||'').replace(/[\s\-'"׳״]/g,'').toLowerCase(); }

/* ======================================================================
   Navigation
   ====================================================================== */
function go(page, params, replace){
  if(replace) S.stack.pop();
  S.stack.push({page:page, params:params||{}});
  render();
}
function back(){ if(S.stack.length>1){ S.stack.pop(); render(); } }
function home(){ S.stack=[{page:'home',params:{}}]; render(); }
el('btnBack').onclick=back; el('btnHome').onclick=home; el('btnRefresh').onclick=function(){ refresh(false); };

function render(){
  var view=el('view'); view.innerHTML=''; el('bar').hidden=true; el('bar').innerHTML=''; closeSheet();
  if(!S.role){ el('top').hidden=true; document.body.style.paddingBottom='0'; return S.mode==='codes'?renderLogin(view):renderGate(view); }
  el('top').hidden=false; document.body.style.paddingBottom='84px';
  el('roleBadge').textContent = roleLabel();
  if(!S.snap){ view.appendChild(h('div',{class:'empty'},['טוען נתונים מהטבלה…'])); return; }
  var cur=S.stack[S.stack.length-1]||{page:'home',params:{}};
  el('btnBack').style.visibility = S.stack.length>1?'visible':'hidden';
  var fn=PAGES[cur.page]||PAGES.home;
  fn(view,cur.params);
  window.scrollTo(0,0);
}
function setTitle(t){ el('title').textContent=t; }

/* ======================================================================
   Login
   ====================================================================== */
function renderLogin(view){
  var inp=h('input',{type:'password',inputmode:'numeric',placeholder:'קוד גישה',autocomplete:'off',class:'center'});
  var btn=h('button',{class:'btn full mt',onclick:doLogin},['כניסה']);
  function doLogin(){
    var code=inp.value.trim(); if(!code) return;
    busy(true);
    call('login',code).then(function(r){
      if(!r.ok) throw new Error(r.error||'קוד שגוי');
      S.code=code; ls(LS.code,code); applyAuth(r);
      S.stack=[{page:'home',params:{}}];
      render();
      return refresh(true);
    }).catch(function(e){ toast(e.message,'err'); }).finally(function(){ busy(false); });
  }
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  view.appendChild(h('div',{class:'login'},[
    h('div',{class:'logo'},['🎖️']), h('h1',{},['לוגיסטיקה גדודית']),
    h('p',{class:'muted mb'},['הזן קוד גישה כדי להמשיך']),
    inp, btn
  ]));
  setTimeout(function(){ inp.focus(); },50);
}
function logout(){ S.code=''; S.role=''; ls(LS.code,null); ls(LS.role,null); S.stack=[]; render(); }

/* sheet mode: access comes from the Google account – checking / no-access screen */
function renderGate(view){
  var box=h('div',{class:'login'},[h('div',{class:'logo'},['🎖️']), h('h1',{},['לוגיסטיקה גדודית'])]);
  if(!S.denied){ box.appendChild(h('p',{class:'muted'},['בודק הרשאות…'])); view.appendChild(box); return; }
  box.appendChild(h('p',{class:'mb',style:'color:var(--danger);font-weight:600'},['אין גישה']));
  box.appendChild(h('p',{class:'muted small'},[S.denied]));
  box.appendChild(h('button',{class:'btn full mt',onclick:function(){ checkAccess(true); }},['בדיקה מחדש']));
  box.appendChild(h('p',{class:'muted small mt'},['מחובר/ת לחשבון אחר? החלף חשבון Google בדפדפן ופתח שוב את הקישור.']));
  view.appendChild(box);
}

    list.appendChild(h('div',{class:'row mb'},[h('h2',{class:'grow',style:'margin:0'},['בחר פריטים לזיכוי']),h('button',{class:'btn ghost sm',onclick:function(){ if(all) sel={}; else its.forEach(function(a){ sel[a.serial]=1; }); drawList(); }},[all?'נקה':'בחר הכל'])]));
    var l=h('div',{class:'list'});
    its.forEach(function(a){ l.appendChild(h('button',{class:'item',onclick:function(){ if(sel[a.serial]) delete sel[a.serial]; else sel[a.serial]=1; drawList(); }},[h('span',{class:'check'+(sel[a.serial]?' on':'')},[sel[a.serial]?'✓':'']),h('div',{class:'t'},[h('b',{},[a.item]),h('span',{class:'num'},[a.serial+(a.notes?'  ·  '+a.notes:'')])])])); });
    if(!its.length) l.appendChild(h('div',{class:'empty'},['אין ציוד מוחתם']));
    list.appendChild(l); drawBar();
  }
  function drawBar(){ var n=Object.keys(sel).length; bar([h('div',{class:'info'},[n?n+' פריטים נבחרו':'בחר פריטים']),h('button',{class:'btn danger',disabled:!n,onclick:function(){ doReturn(Object.keys(sel),state.name); }},['↩️ זכה'])]); }
  view.appendChild(who); view.appendChild(list); drawWho(); drawList();
};
function doReturn(serials,name){
  var notes=h('input',{type:'text',placeholder:'הערה ללוג (אופציונלי)'});
  var dest=ST.OK;
  var chips=h('div',{class:'chips mb'});
  function drawChips(){ chips.innerHTML=''; S.snap.statuses.forEach(function(st){ chips.appendChild(h('button',{class:'chipbtn'+(dest===st?' on':''),onclick:function(){ dest=st; drawChips(); }},[st])); }); }
  drawChips();
  sheet('אישור זיכוי',h('div',{},[h('p',{},['לזכות '+serials.length+' פריטים'+(name?' מ-'+name:'')+'?']),h('p',{class:'small muted num right'},[serials.join(', ')]),h('div',{class:'sec'},['לאן הציוד הולך?']),chips,notes]),[
    h('button',{class:'btn ghost grow',onclick:closeSheet},['ביטול']),
    h('button',{class:'btn danger grow',onclick:function(){ closeSheet(); busy(true); call('returnItems',{code:S.code,serials:serials,destination:dest,notes:notes.value}).then(function(r){ toast('זוכו '+r.count+' פריטים → '+r.destination,'ok'); if(name){ S.stack=S.stack.filter(function(x){ return x.page!=='return'; }); if(S.stack[S.stack.length-1].page!=='person') go('person',{name:name}); else render(); } else back(); return refresh(true); }).catch(function(e){ toast(e.message,'err'); }).finally(function(){ busy(false); }); }},['זכה'])
  ]);
}

/* ---------- people directory (אלפון) ---------- */
PAGES.people=function(view){
  setTitle('אלפון גדודי');
  var idx=S.idx;
  var q=h('input',{type:'search',placeholder:'חיפוש: שם / מס׳ אישי / טלפון',autocomplete:'off'}); var box=h('div',{class:'list'});
  var comp=''; var chips=h('div',{class:'chips mb'});
  function drawChips(){ chips.innerHTML=''; [''].concat(idx.companies).forEach(function(c){ chips.appendChild(h('button',{class:'chipbtn'+(comp===c?' on':''),onclick:function(){ comp=c; drawChips(); draw(); }},[c||'הכל'])); }); }
  function draw(){
    box.innerHTML=''; var qq=norm(q.value);
    var list=S.snap.people.filter(function(p){ return (!comp||p.company===comp)&&(!qq||norm(p.name).indexOf(qq)>=0||norm(p.pid).indexOf(qq)>=0||norm(p.phone).indexOf(qq)>=0); })
      .sort(function(a,b){ return (a.company+a.unit+a.name).localeCompare(b.company+b.unit+b.name,'he'); }).slice(0,150);
    if(!list.length) box.appendChild(h('div',{class:'empty'},['אין תוצאות']));
    list.forEach(function(p){ box.appendChild(personRow(p)); });
  }
  q.addEventListener('input',draw); drawChips();
  view.appendChild(h('div',{class:'card'},[q,chips,box])); draw();
  if(isAdmin()) bar([h('button',{class:'btn grow',onclick:function(){ go('editPerson',{row:0}); }},['➕ חייל חדש'])]);
};
PAGES.editPerson=function(view,p){
  var idx=S.idx, row=p.row||0;
  var cur=row?S.snap.people.filter(function(x){ return x.row===row; })[0]:null;
  setTitle(cur?'עריכת חייל':'חייל חדש');
  var first=h('input',{type:'text',placeholder:'שם פרטי',value:cur?cur.first:''});
  var last=h('input',{type:'text',placeholder:'שם משפחה',value:cur?cur.last:''});
  var pid=h('input',{type:'text',inputmode:'numeric',class:'num',placeholder:'מספר אישי',value:cur?cur.pid:''});
  var phone=h('input',{type:'tel',class:'num',placeholder:'מספר טלפון',value:cur?cur.phone:''});
  var company=h('select'); company.appendChild(h('option',{value:''},['— פלוגה —'])); idx.companies.forEach(function(c){ var o=h('option',{value:c},[c]); if(cur&&cur.company===c) o.selected=true; company.appendChild(o); });
  var unit=h('input',{type:'text',placeholder:'מחלקה / צוות',list:'dlu',value:cur?cur.unit:''});
  var dlu=h('datalist',{id:'dlu'});
  function fillUnits(){ dlu.innerHTML=''; var us=idx.unitsByCompany[company.value]||{}; Object.keys(us).sort().forEach(function(u){ if(u!=='ללא מחלקה') dlu.appendChild(h('option',{value:u})); }); }
  company.addEventListener('change',fillUnits); fillUnits();
  var full=h('div',{class:'small muted mt'});
  function upd(){ full.textContent='שם מלא: '+((first.value.trim()+' '+last.value.trim()).trim()||'—')+(cur&&cur.name!==(first.value.trim()+' '+last.value.trim()).trim()&&(idx.byPerson[cur.name]||[]).length?'  ·  השם ישתנה גם ב-'+(idx.byPerson[cur.name]||[]).length+' שורות בגדודי':''); }
  first.addEventListener('input',upd); last.addEventListener('input',upd); upd();
  view.appendChild(h('div',{class:'card'},[
    h('div',{class:'row'},[first,last]),h('div',{class:'mt'}),pid,h('div',{class:'mt'}),phone,h('div',{class:'mt'}),company,h('div',{class:'mt'}),unit,dlu,full
  ]));
  if(cur&&isAdmin()) view.appendChild(h('button',{class:'btn ghost full',style:'color:var(--danger);border-color:var(--danger)',onclick:function(){
    confirmSheet('מחיקת חייל','למחוק את '+cur.name+' מהאלפון? (אפשרי רק אם אין עליו ציוד מוחתם)','מחק',true).then(function(ok){ if(!ok) return; busy(true); call('deletePerson',{code:S.code,row:cur.row,name:cur.name}).then(function(){ toast('החייל נמחק','ok'); S.stack=S.stack.filter(function(x){ return x.page!=='editPerson'&&x.page!=='person'; }); render(); return refresh(true); }).catch(function(e){ toast(e.message,'err'); }).finally(function(){ busy(false); }); });
  }},['🗑️ מחיקת חייל']));
  bar([h('button',{class:'btn grow',onclick:function(){
    if(!first.value.trim()||!last.value.trim()) return toast('חסר שם פרטי או שם משפחה','err');
    busy(true);
    call('savePerson',{code:S.code,row:row,first:first.value.trim(),last:last.value.trim(),pid:pid.value.trim(),company:company.value,unit:unit.value.trim(),phone:phone.value.trim()}).then(function(r){
      toast(cur?'הפרטים נשמרו':'החייל נוסף','ok'); S.stack.pop(); if(S.stack.length&&S.stack[S.stack.length-1].page==='person') S.stack[S.stack.length-1].params={name:r.name}; else go('person',{name:r.name}); return refresh(true);
    }).catch(function(e){ toast(e.message,'err'); }).finally(function(){ busy(false); });
  }},['💾 שמירה'])]);
};

/* ---------- log ---------- */
PAGES.log=function(view){
  setTitle('לוג פעולות');
  var box=h('div',{class:'card'},[h('div',{class:'empty'},['טוען…'])]); view.appendChild(box);
  call('getLog',S.code,300).then(function(r){
    box.innerHTML='';
    if(!r.rows.length) return box.appendChild(h('div',{class:'empty'},['אין פעולות עדיין']));
    var q=h('input',{type:'search',placeholder:'סינון'}); var l=h('div',{class:'list mt'});
    function draw(){ l.innerHTML=''; var qq=norm(q.value); r.rows.filter(function(x){ return !qq||norm(x.name+x.item+x.serial+x.action+x.notes).indexOf(qq)>=0; }).forEach(function(x){
      l.appendChild(h('div',{class:'item'},[h('div',{class:'t'},[h('b',{},[x.action+(x.name?' · '+x.name:'')]),h('span',{},[[x.item,x.serial,x.notes].filter(Boolean).join(' · ')]),h('span',{class:'small'},[x.time+' · '+x.role])]),/^https?:/.test(x.link||'')?h('a',{href:x.link,target:'_blank',class:'chip'},['📄']):null]));
    }); }
    q.addEventListener('input',draw); box.appendChild(q); box.appendChild(l); draw();
  }).catch(function(e){ box.innerHTML=''; box.appendChild(h('div',{class:'empty'},[e.message])); });
};

/* ---------- bottom bar ---------- */
function bar(children){ var b=el('bar'); b.innerHTML=''; children.forEach(function(c){ b.appendChild(c); }); b.hidden=false; }
function fmtTime(iso){ try{ var d=new Date(iso); return d.toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }

/* ======================================================================
   Boot
   ====================================================================== */
(function boot(){
  S.stack=[{page:'home',params:{}}];
  if(S.role && (S.mode!=='codes' || S.code)){
    loadSnapLocal();
    render();                   // show the cached snapshot right away
    refresh(true);              // getSnapshot re-checks the role (it may have changed in the sheet sharing)
  } else {
    render();                   // gate screen ("בודק הרשאות…") or code login
    checkAccess(false);
  }
})();
</script>
